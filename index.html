<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Islamic AI - بک اسٹور</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="top-bar">
        <p>🚚 پورے پاکستان میں فری ڈیلیوری | 💬 واٹس ایپ 0328-6775001</p>
    </div>

    <header>
        <div class="container header-flex">
            <div class="logo"><h1>Islamic AI</h1></div>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <section class="hero">
        <h2>اسلامی کتب کا بہترین مجموعہ</h2>
        <p>قرآنی کتب | حدیث | دینی لٹریچر</p>
    </section>

    <div class="filters">
        <button class="filter-btn active" onclick="filterBooks('all')">سب بکس</button>
        <button class="filter-btn" onclick="filterBooks('quran')">قرآن</button>
        <button class="filter-btn" onclick="filterBooks('hadees')">حدیث</button>
        <button class="filter-btn" onclick="filterBooks('fiqh')">فقہ</button>
    </div>

    <main class="container">
        <div id="books-grid" class="books-grid">
            </div>
    </main>

    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>آپ کی کارٹ</h3>
            <span onclick="toggleCart()">&times;</span>
        </div>
        <div id="cart-items"></div>
        <div class="cart-footer">
            <h4 id="total-price">ٹوٹل: 0 روپے</h4>
            <button class="whatsapp-btn" onclick="orderViaWhatsApp()">واٹس ایپ پر آرڈر کریں</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
